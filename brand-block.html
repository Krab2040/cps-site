<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="stylesheet/stylesheet.css">
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css">
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <title>brand-block</title>
</head>
<body>
<article class="brand-block">
    <h2 class="brand-block__title">Ремонт техники различных брендов</h2>
    <div class="brand-block__content swiper">
        <ul class="brands swiper-wrapper">
            <li class="swiper-slide">
                <div class="brands__item">
                    <img src="icons/lenovo.svg" alt="lenovo"/>
                    <button class="brands__item__button button--transparent"></button>
                </div>
            </li>
            <li class=" swiper-slide">
                <div class="brands__item">
                    <img src="icons/samsung.svg" alt="samsung"/>
                    <button class="brands__item__button button--transparent"></button>
                </div>
            </li>
            <li class=" swiper-slide">
                <div class="brands__item">
                    <img src="icons/apple.svg" alt="apple"/>
                    <button class="brands__item__button button--transparent"></button>
                </div>
            </li>
            <li class=" swiper-slide">
                <div class="brands__item">
                    <img src="icons/viewsonic.svg" alt="viewsonic"/>
                    <button class="brands__item__button button--transparent"></button>
                </div>
            </li>
            <li class=" swiper-slide">
                <div class="brands__item">
                    <img src="icons/bosch.svg" alt="bosch"/>
                    <button class="brands__item__button button--transparent"></button>
                </div>
            </li>
            <li class=" swiper-slide">
                <div class="brands__item">
                    <img src="icons/hp.svg" alt="hp"/>
                    <button class="brands__item__button button--transparent"></button>
                </div>
            </li>
            <li class=" swiper-slide">
                <div class="brands__item">
                    <img src="icons/acer.svg" alt="acer"/>
                    <button class="brands__item__button button--transparent"></button>
                </div>
            </li>
            <li class="swiper-slide">
                <div class="brands__item">
                    <img src="icons/sony.svg" alt="sony"/>
                    <button class="brands__item__button button--transparent"></button>
                </div>
            </li>
            <li class="swiper-slide">
                <div class="brands__item">
                    <img src="icons/lenovo.svg" alt="lenovo"/>
                    <button class="brands__item__button button--transparent"></button>
                </div>
            </li>
            <li class=" swiper-slide">
                <div class="brands__item">
                    <img src="icons/samsung.svg" alt="samsung"/>
                    <button class="brands__item__button button--transparent"></button>
                </div>
            </li>
            <li class=" swiper-slide">
                <div class="brands__item">
                    <img src="icons/apple.svg" alt="apple"/>
                    <button class="brands__item__button button--transparent"></button>
                </div>
            </li>
        </ul>
        <div class="swiper-pagination"></div>
    </div>

    <button class="brand-block__button" id="brands_button" type="button" aria-label="Показать все">
        <div class="arrows"></div>
        <span class="brand-block__button--text">Показать все</span>
    </button>
</article>
<script src="index.js"></script>
</body>
</html>
