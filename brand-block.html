<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="stylesheet/stylesheet.css" >
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css">
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <title>brand-block</title>
</head>
<body>
    <article class="brand-block">
        <h2 class = "brand-block__title">Ремонт техники различных брендов</h2>
        <div class="brand-block__content swiper">
            <ul class="brands swiper-wrapper">
                <li class="brands-item swiper-slide">
                    <img src="icons/lenovo.svg " alt="логотип lenovo">
                    <button class="brands-item__button"> </button>
                </li>
                <li class="brands-item swiper-slide">
                    <img src="icons/samsung.svg " alt="логотип samsung">
                    <button class="brands-item__button"> </button>
                </li>
                <li class="brands-item swiper-slide">
                    <img src="icons/apple.svg " alt="логотип apple">
                    <button class="brands-item__button"> </button>
                </li>
                <li class="brands-item swiper-slide">
                    <img src="icons/viewsonic.svg " alt="логотип viewsonic">
                    <button class="brands-item__button"> </button>
                </li>
                <li class="brands-item swiper-slide">
                    <img src="icons/bosch.svg " alt="логотип bosch">
                    <button class="brands-item__button"> </button>
                </li>
                <li class="brands-item swiper-slide">
                    <img src="icons/hp.svg " alt="логотип hp">
                    <button class="brands-item__button"> </button>
                </li>
                <li class="brands-item swiper-slide">
                    <img src="icons/acer.svg " alt="логотип acer">
                    <button class="brands-item__button"> </button>
                </li>
                <li class="brands-item swiper-slide">
                    <img src="icons/sony.svg " alt="логотип sony">
                    <button class="brands-item__button"> </button>
                </li>
                <li class="brands-item swiper-slide">
                    <img src="icons/lenovo.svg "alt="логотип lenovo">
                    <button class="brands-item__button"> </button>
                </li>
            </ul>
            <div class="swiper-pagination"></div>
            </div>
            <button class="brand-block__button">Показать все</button>
    </article>
</body>
</html>
