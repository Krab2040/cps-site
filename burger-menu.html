<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="stylesheet/stylesheet.css">
  <title>burger-menu</title>
</head>
<body>
<div class="burger-menu">
  <section class="burger-menu__header">
    <div class="burger-menu__right-side">
      <button class="button button--close"></button>
      <img src="./icons/cps.svg" alt="CPS Logo">
    </div>
    <div class="burger-menu__left-side">
      <button class="button button--search"></button>
    </div>
  </section>
  <section class="burger-menu__content">
    <nav>
      <ul>
        <li>
            <a href="#">Ремонт техники</a>
        </li>
        <li>
          <a href="#">Услуги и сервисы</a>
        </li>
        <li>
          <a href="#">Корпоративным клиентам</a>
        </li>
        <li>
          <a href="#">Продавцам техники</a>
        </li>
        <li>
            <a href="#">Партнерам</a>
        </li>
        <li>
            <a href="#">Производителям</a>
        </li>
        <li>
          <a href="#">Наши сервисные центры</a>
        </li>
        <li><a href="#">Контакты</a></li>
      </ul>
    </nav>
  </section>

  <section class="burger-menu__footer">
    <ul class="burger-menu__footer__contacts">
      <li>
        <button type="button" class="button button--call"></button>
      </li>
      <li>
        <button type="button" class="button button--chat"></button>
      </li>
      <li>
        <button type="button" class="button button--profile"></button>
      </li>
    </ul>
    <div class="burger-menu__footer__email">
      <a href="#">mail@cps.com</a>
    </div>
    <div class="burger-menu__footer__number">
      <a href="#">8 800 890 8900</a>
    </div>
    <ul class="burger-menu__footer__language">
      <li><button>RU</button></li>
      <li><button>EN</button></li>
      <li><button>CH</button></li>
    </ul>
  </section>
</div>
</body>
</html>
